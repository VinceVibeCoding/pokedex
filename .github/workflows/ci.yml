name: CI

# Mirrors what Vercel actually runs in production (prisma generate + next build),
# so a broken build shows up as a red X within ~1 minute of pushing instead of
# only being discovered by checking the live site.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      REDIS_URL: "redis://localhost:6379"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Also does the full type-check as an integrated step (visible as "Running
      # TypeScript" in the build log) — Next.js generates ambient types (PageProps,
      # LayoutProps, etc.) into .next/types during this step, so a standalone
      # `tsc --noEmit` run beforehand fails on a fresh checkout with "Cannot find
      # name 'PageProps'" even though it works locally once .next/ already exists.
      - name: Build (same command Vercel runs in production)
        run: npx prisma generate && npx next build
